name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cypress-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Cache do binário do Cypress
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-binary-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependências
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Executar testes Cypress
        uses: cypress-io/github-action@v6
        with:
          install: false

      - name: Diagnóstico - listar pasta de relatórios
        if: always()
        run: |
          echo "Conteúdo da raiz do projeto:"
          ls -la
          echo "---"
          echo "Conteúdo de cypress/ (se existir):"
          ls -laR cypress/reports 2>&1 || echo "cypress/reports não existe"

      - name: Upload do relatório mochawesome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report
          path: cypress/reports/mochawesome
          retention-days: 14
